<!DOCTYPE html>
<html>

<head>

  <title>CSS Animation</title>

  <style>

    .square {
      width: 100px;
      height: 100px;
      background-color: red;


      animation: slide 3s infinite;
    }

    @keyframes slide {

      0% {
        transform: translateY(0);
        background-color: red;
      }

      50% {
        transform: translateY(400px);
        background-color: blue;
      }

      100% {
        transform: translateY(0);
        background-color: rgb(22, 209, 128);
      }

    }

  </style>

</head>


<body>

  <div class="square"></div>

</body>

</html>
