<!DOCTYPE html>
<html>
<head>
  <title>JSON Placeholder Posts</title>
</head>

<body>

  <h1>Check the console</h1>

  <script>

    fetch('https://jsonplaceholder.typicode.com/posts')
      .then(function(response) {
        return response.json();
      })
      .then(function(json) {
        console.log(json);
      });

  </script>

</body>
</html>
